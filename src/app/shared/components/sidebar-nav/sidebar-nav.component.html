<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor" />
        <rect x="13" y="3" width="8" height="8" rx="2" fill="currentColor" opacity="0.55" />
        <rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor" opacity="0.55" />
        <rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor" />
      </svg>
    </span>
    <span class="sidebar__brand-text">OptiStock</span>
  </div>

  <nav class="sidebar__nav" aria-label="Navegación principal">
    <ul>
      <li>
        <a class="nav-link" routerLink="/dashboard" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: false }">
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a class="nav-link" routerLink="/productos" routerLinkActive="is-active">
          <span>Productos</span>
        </a>
      </li>
      <li>
        <a class="nav-link" routerLink="/inventario" routerLinkActive="is-active">
          <span>Inventario</span>
        </a>
      </li>
      <li>
        <a class="nav-link" routerLink="/movimientos" routerLinkActive="is-active">
          <span>Movimientos</span>
        </a>
      </li>
      <li>
        <a class="nav-link" routerLink="/alertas" routerLinkActive="is-active">
          <span>Alertas</span>
          @if (alertCount() > 0) {
            <span class="nav-link__badge">{{ alertCount() }}</span>
          }
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar__footer">
    <span>Papelería Central</span>
  </div>
</aside>
